ServerName localhost

<VirtualHost *:${PORT}>
	DocumentRoot /var/www/html
	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# The database is installed and upgraded from the CLI at boot, so the web installer
	# (and the config it would rewrite) is never reachable. Seo Panel still reads its
	# SQL data from install/data at runtime, which is why the folder stays.
	<LocationMatch "^/(install|config)(/|$)|^/(CLAUDE|README|INSTALLATION|COPYING|SECURITY|RELEASE_NOTES)|/\.">
		Require all denied
	</LocationMatch>

	Alias /healthz /usr/local/share/seopanel/healthz
	<Directory /usr/local/share/seopanel>
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog /dev/null combined
</VirtualHost>
